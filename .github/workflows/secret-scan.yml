name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks 8.30.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$archive"
          echo '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  '"$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the proposed commit range with redaction
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$GITHUB_SHA"
          else
            before_sha="$EVENT_BEFORE"
            if [[ "$before_sha" =~ ^0+$ ]]; then
              echo "Initial branch publication; the pull request scan will verify the complete proposed range."
              exit 0
            fi
            base_sha="$before_sha"
            head_sha="$GITHUB_SHA"
          fi

          git cat-file -e "$base_sha^{commit}"
          git cat-file -e "$head_sha^{commit}"
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts "$base_sha..$head_sha" \
            --redact \
            --no-banner \
            --exit-code 1
