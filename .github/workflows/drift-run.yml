# Scheduled Drift_Run — RAOS WS5 (task 13.2, Requirement 18.1)
#
# Runs a recurring `Drift_Run` of the Audit_System: a FULL audit (all 23 domains
# incl. synthetic runs) PLUS the opt-in Deep_Run (warm-run p95/p99 latency
# percentiles) across >= 5 industries.
#
# This is where the full / Deep_Run lives — NOT the PR release gate. The blocking
# release-gate job (task 13.1) runs a bounded Static + P0 CI profile only, because
# a full audit + Deep_Run is a heavy synthetic run (minutes-to-hours) that would
# blow GitHub Actions limits on every PR. The Drift_Run therefore runs on a cron
# schedule (and on-demand via workflow_dispatch).
#
# Cron is the single source of truth in lib/raos/driftRun.ts (DRIFT_RUN_CRON);
# keep this `cron:` value in sync with it (asserted by the scheduler-wiring
# integration test, task 13.6).

name: Drift_Run

on:
  # Weekly — Mondays at 06:00 UTC (GitHub Actions cron is always UTC).
  schedule:
    - cron: '0 6 * * 1'
  # Allow an operator to trigger an on-demand Drift_Run.
  workflow_dispatch:
    inputs:
      industries:
        description: 'Comma-separated industries to span (>= 5). Blank = defaults.'
        required: false
        default: ''
      deepRunRunsPerIndustry:
        description: 'Deep_Run runs/industry (20-100).'
        required: false
        default: '20'

# Read-only to the repo: the Audit_System stays read-only to prod and Notion
# (the RAOS non-destructive boundary, R24). The Drift_Run only emits artifacts.
permissions:
  contents: read

concurrency:
  group: drift-run
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'

jobs:
  drift-run:
    name: Scheduled Drift_Run (FULL + Deep_Run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run scheduled Drift_Run (Audit_System FULL + Deep_Run across >= 5 industries)
        env:
          DRIFT_RUN_INDUSTRIES: ${{ github.event.inputs.industries }}
          DRIFT_RUN_DEEP_RUNS_PER_INDUSTRY: ${{ github.event.inputs.deepRunRunsPerIndustry }}
        run: npm run raos:drift-run

      - name: Upload Drift_Run artifacts (four sinks)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-run-artifacts
          path: .kiro/raos/artifacts/
          retention-days: 30
          if-no-files-found: ignore
