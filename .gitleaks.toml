title = "ProposalOS gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known-safe placeholders, test fixtures, and internal IDs"

# Exact placeholder strings that are never real credentials
regexes = [
  '''<password>''',
  '''<user>:<password>''',
  '''REDACTED''',
  '''postgresql://<[^>]+>:<[^>]+>@''',
  '''sk_live_vulnerable_key_12345''',
  '''sk_live_512345''',
  '''sk_test_placeholder''',
  '''your-api-key''',
  '''autonomous_pipeline''',
  '''secret_api_key_123''',
  '''whsec_test_secret''',
  '''test-idempotency''',
  # Synthetic test fixtures used to prove PiiScrubber detects Stripe patterns
  # These are obviously fake (all-same-char, 40 chars of filler)
 
 
  # Specific webLinkToken used in logger test — synthetic UUID
  '''f37e7853-8d5b-43de-b17f-d69561175571''',
]

# Paths containing only test fixtures, docs placeholders, or internal audit evidence
paths = [
  '''SECURITY-INCIDENT\.md''',
  '''.*\.example$''',
  '''docs/remediation/029-beta-day0-five-site-audit-evidence\.json''',
  '''docs/remediation/034-first-pilot-launch-simulation\.md''',
  '''docs/archive/AUDIT_REPORT\.md''',
  '''GCP_SETUP_COMPLETE\.md''',
]
