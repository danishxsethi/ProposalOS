[pgbouncer]

; --- Network ---
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

; --- Authentication ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; --- Pool Settings ---
pool_mode = transaction
max_client_conn = 100
default_pool_size = 10
min_pool_size = 2
reserve_pool_size = 2
reserve_pool_timeout = 3

; --- Timeouts ---
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 5
query_timeout = 300
query_wait_timeout = 120
client_idle_timeout = 3600
client_login_timeout = 60
idle_client_timeout = 3600

; --- Logging ---
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

; --- Admin Access ---
admin_users = postgres
stats_users = postgres

; --- DNS ---
dns_max_ttl = 300
dns_nxdomain_ttl = 300

; --- TLS (optional - configure for production) ---
; ssl = 1
; ssl_cert_file = /etc/certs/server.crt
; ssl_key_file = /etc/certs/server.key
; ssl_ca_file = /etc/certs/ca.crt