name: AWS Production Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Deploy the reviewed main commit to ProposalOS production in AWS
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: proposalos-production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the exact source commit
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  deploy:
    name: Build and deploy immutable AWS release
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.confirm_production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      AWS_ACCOUNT_ID: '410432886960'
      ECS_CLUSTER: proposalos-production
      API_SERVICE: proposalos-production-api
      WEB_SERVICE: proposalos-production-web
      API_REPOSITORY: proposalos-production-proposal-engine
      WEB_REPOSITORY: proposalos-production-claraud-web
      MIGRATOR_REPOSITORY: proposalos-production-migration-importer
    steps:
      - name: Check out the exact commit being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assume the main-only AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::410432886960:role/ProposalOSGitHubActionsProductionDeploy
          role-session-name: proposalos-${{ github.run_id }}
          aws-region: us-east-2

      - name: Verify AWS account and build tools
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "$account" = "$AWS_ACCOUNT_ID"
          docker buildx version

      - name: Log in to the production ECR registry
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Read the existing public Stripe key for deterministic builds
        id: public-config
        shell: bash
        run: |
          set -euo pipefail
          key="$(aws ecs describe-task-definition \
            --task-definition proposalos-production-api \
            --output json \
            | jq -er '.taskDefinition.containerDefinitions[] | select(.name == "api") | .environment[] | select(.name == "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY") | .value')"
          [[ "$key" == pk_live_* ]]
          echo "stripe-publishable-key=$key" >> "$GITHUB_OUTPUT"

      - name: Build and push SHA-tagged API, web, and migrator images
        id: images
        shell: bash
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ steps.public-config.outputs.stripe-publishable-key }}
        run: |
          set -euo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          api_uri="$registry/$API_REPOSITORY"
          web_uri="$registry/$WEB_REPOSITORY"
          migrator_uri="$registry/$MIGRATOR_REPOSITORY"

          if ! aws ecr describe-images --repository-name "$API_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            docker buildx build --platform linux/amd64 --push \
              --file Dockerfile \
              --tag "$api_uri:$GITHUB_SHA" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "DATABASE_URL=postgresql://build:build@localhost:5432/build" \
              --build-arg "AWS_REGION=$AWS_REGION" \
              --build-arg "NEXT_PUBLIC_APP_URL=https://claraud.com" \
              --build-arg "NEXT_PUBLIC_BASE_URL=https://claraud.com" \
              --build-arg "NEXT_PUBLIC_APP_VERSION=$GITHUB_SHA" \
              --build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY" \
              .
          fi

          if ! aws ecr describe-images --repository-name "$WEB_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            docker buildx build --platform linux/amd64 --push \
              --file claraud-web/Dockerfile \
              --tag "$web_uri:$GITHUB_SHA" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "NEXT_PUBLIC_APP_URL=https://claraud.com" \
              --build-arg "NEXT_PUBLIC_BASE_URL=https://claraud.com" \
              --build-arg "NEXT_PUBLIC_APP_VERSION=$GITHUB_SHA" \
              --build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY" \
              .
          fi

          if ! aws ecr describe-images --repository-name "$MIGRATOR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            docker buildx build --platform linux/amd64 --push \
              --file Dockerfile.production-migrate \
              --tag "$migrator_uri:$GITHUB_SHA" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              .
          fi

          api_digest="$(aws ecr describe-images --repository-name "$API_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          web_digest="$(aws ecr describe-images --repository-name "$WEB_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          migrator_digest="$(aws ecr describe-images --repository-name "$MIGRATOR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$api_digest" == sha256:* && "$web_digest" == sha256:* && "$migrator_digest" == sha256:* ]]
          {
            echo "api-digest=$api_digest"
            echo "web-digest=$web_digest"
            echo "migrator-digest=$migrator_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Run production Prisma migrations before application rollout
        id: migrate
        shell: bash
        env:
          MIGRATOR_DIGEST: ${{ steps.images.outputs.migrator-digest }}
        run: |
          set -euo pipefail
          db="$(aws rds describe-db-instances \
            --db-instance-identifier proposalos-production-db \
            --region "$AWS_REGION" \
            --output json \
            | jq -er '.DBInstances[0] | select(.DBInstanceStatus == "available") | {endpoint: .Endpoint.Address, port: .Endpoint.Port, secret: .MasterUserSecret.SecretArn}')"
          endpoint="$(jq -er '.endpoint' <<<"$db")"
          port="$(jq -er '.port' <<<"$db")"
          secret_arn="$(jq -er '.secret' <<<"$db")"
          [[ "$endpoint" == proposalos-production-db.*.us-east-2.rds.amazonaws.com ]]
          [[ "$secret_arn" == arn:aws:secretsmanager:us-east-2:410432886960:secret:rds!db-* ]]

          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          jq -n \
            --arg image "$registry/$MIGRATOR_REPOSITORY@$MIGRATOR_DIGEST" \
            --arg role "arn:aws:iam::$AWS_ACCOUNT_ID:role/ProposalOSProductionSchemaMigratorExecutionRole" \
            --arg region "$AWS_REGION" \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg endpoint "$endpoint" \
            --arg port "$port" \
            --arg secret "$secret_arn" \
            ' {
              family: "proposalos-production-schema-migrator",
              executionRoleArn: $role,
              networkMode: "awsvpc",
              requiresCompatibilities: ["FARGATE"],
              cpu: "256",
              memory: "512",
              containerDefinitions: [{
                name: "schema-migrator",
                image: $image,
                essential: true,
                environment: [
                  {name: "AWS_REGION", value: $region},
                  {name: "EXPECTED_AWS_ACCOUNT_ID", value: $account},
                  {name: "EXPECTED_RDS_IDENTIFIER", value: "proposalos-production-db"},
                  {name: "TARGET_DATABASE", value: "proposal_engine"},
                  {name: "RDS_ENDPOINT", value: $endpoint},
                  {name: "RDS_PORT", value: $port}
                ],
                secrets: [{name: "RDS_MASTER_SECRET_JSON", valueFrom: $secret}],
                logConfiguration: {
                  logDriver: "awslogs",
                  options: {
                    "awslogs-group": "/ecs/proposalos-production/migration-importer",
                    "awslogs-region": $region,
                    "awslogs-stream-prefix": "task"
                  }
                }
              }]
            }' > "$RUNNER_TEMP/schema-migrator-task-definition.json"

          task_definition="$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/schema-migrator-task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$API_SERVICE" \
            --query 'services[0].networkConfiguration' --output json > "$RUNNER_TEMP/production-network.json"
          jq -e '.awsvpcConfiguration.subnets | length > 0' "$RUNNER_TEMP/production-network.json" >/dev/null

          task_arn="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --network-configuration "file://$RUNNER_TEMP/production-network.json" \
            --started-by "gha-$GITHUB_RUN_ID" \
            --query 'tasks[0].taskArn' --output text)"
          [[ "$task_arn" == arn:aws:ecs:*:task/proposalos-production/* ]]
          echo "task-arn=$task_arn" >> "$GITHUB_OUTPUT"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)"
          task_id="${task_arn##*/}"
          stream="task/schema-migrator/$task_id"
          aws logs get-log-events \
            --log-group-name /ecs/proposalos-production/migration-importer \
            --log-stream-name "$stream" --start-from-head --output json \
            | jq -r '.events[].message' || true
          [[ "$exit_code" == 0 ]]

      - name: Register and deploy API and web task definitions by image digest
        id: deploy-services
        shell: bash
        env:
          API_DIGEST: ${{ steps.images.outputs.api-digest }}
          WEB_DIGEST: ${{ steps.images.outputs.web-digest }}
        run: |
          set -euo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          register_task_definition() {
            local family="$1"
            local container="$2"
            local image="$3"
            local digest="$4"
            local prefix="$5"
            local source="$RUNNER_TEMP/${prefix}-current.json"
            local definition="$RUNNER_TEMP/${prefix}-task-definition.json"
            aws ecs describe-task-definition --include TAGS --task-definition "$family" --output json > "$source"
            jq --arg container "$container" --arg image "$image" --arg sha "$GITHUB_SHA" --arg digest "$digest" '
              def upsert_env($name; $value):
                .environment = (((.environment // []) | map(select(.name != $name))) + [{name: $name, value: $value}]);
              . as $described
              | .taskDefinition
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt, .enableFaultInjection)
              | .containerDefinitions |= map(
                  if .name == $container then
                    .image = $image
                    | upsert_env("DEPLOY_COMMIT"; $sha)
                    | if $container == "api" then upsert_env("NEXT_PUBLIC_APP_VERSION"; $sha) else . end
                  else . end
                )
              | . + {tags: ((($described.tags // []) | map(select(.key != "SourceSHA" and .key != "ImageDigest"))) + [{key: "SourceSHA", value: $sha}, {key: "ImageDigest", value: $digest}])}
            ' "$source" > "$definition"
            aws ecs register-task-definition --cli-input-json "file://$definition" \
              --query 'taskDefinition.taskDefinitionArn' --output text
          }

          api_task_definition="$(register_task_definition proposalos-production-api api "$registry/$API_REPOSITORY@$API_DIGEST" "$API_DIGEST" api)"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$API_SERVICE" \
            --task-definition "$api_task_definition" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$API_SERVICE"

          web_task_definition="$(register_task_definition proposalos-production-web web "$registry/$WEB_REPOSITORY@$WEB_DIGEST" "$WEB_DIGEST" web)"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WEB_SERVICE" \
            --task-definition "$web_task_definition" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$WEB_SERVICE"

          echo "api-task-definition=$api_task_definition" >> "$GITHUB_OUTPUT"
          echo "web-task-definition=$web_task_definition" >> "$GITHUB_OUTPUT"

      - name: Verify deployed digests and public release identity
        shell: bash
        env:
          API_DIGEST: ${{ steps.images.outputs.api-digest }}
          WEB_DIGEST: ${{ steps.images.outputs.web-digest }}
          API_TASK_DEFINITION: ${{ steps.deploy-services.outputs.api-task-definition }}
          WEB_TASK_DEFINITION: ${{ steps.deploy-services.outputs.web-task-definition }}
        run: |
          set -euo pipefail
          assert_service_digest() {
            local service="$1"
            local container="$2"
            local expected="$3"
            local task
            local actual
            task="$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$service" --desired-status RUNNING --query 'taskArns[0]' --output text)"
            [[ "$task" == arn:aws:ecs:*:task/proposalos-production/* ]]
            actual="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" \
              --query "tasks[0].containers[?name=='$container'].imageDigest | [0]" --output text)"
            test "$actual" = "$expected"
          }

          assert_service_digest "$API_SERVICE" api "$API_DIGEST"
          assert_service_digest "$WEB_SERVICE" web "$WEB_DIGEST"

          health="$(curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 5 https://claraud.com/api/health)"
          jq -e --arg sha "$GITHUB_SHA" '.version == $sha' <<<"$health" >/dev/null
          www_status="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' https://www.claraud.com/api/health)"
          test "$www_status" = 200

          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "## AWS production deployment succeeded"
            echo
            echo "- Source SHA: `$GITHUB_SHA`"
            echo "- Region: `$AWS_REGION`"
            echo "- Deployed at: `$deployed_at`"
            echo "- API digest: `$API_DIGEST`"
            echo "- API task definition: `$API_TASK_DEFINITION`"
            echo "- Web digest: `$WEB_DIGEST`"
            echo "- Web task definition: `$WEB_TASK_DEFINITION`"
            echo "- Public health version: `$GITHUB_SHA`"
          } >> "$GITHUB_STEP_SUMMARY"
