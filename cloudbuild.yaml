# Cloud Build configuration for ProposalOS on GCP Cloud Run
# FIX-40: Zero-downtime deployments — deploy to new revision, health-check, then switch traffic.
#
# Substitutions (edit these):
#   _REGION: Your GCP region (e.g. us-central1)
#   _COMMIT_SHA: Set by Cloud Build triggers automatically

substitutions:
  _REGION: 'us-central1'
  _COMMIT_SHA: 'manual'

steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/proposal-engine/app:${_COMMIT_SHA}'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/proposal-engine/app:${_COMMIT_SHA}'

  # Step 3: Deploy new revision with NO traffic (canary/blue-green pattern)
  # FIX-40: --no-traffic means production traffic is NOT routed until health check passes
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'proposal-engine'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/proposal-engine/app:${_COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'       # FIX-40: Always-warm — eliminates cold start gaps
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      - '--no-traffic'   # FIX-40: Deploy without taking live traffic yet
      - '--tag'
      - 'canary'

  # Step 4: Health check the canary revision before switching traffic
  # FIX-40: Verifies the /api/health endpoint returns 200 before cutover
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        CANARY_URL=$(gcloud run services describe proposal-engine \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --format='value(status.url)') 
        echo "Health-checking canary at: $${CANARY_URL}/api/health"
        for i in 1 2 3 4 5; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$${CANARY_URL}/api/health")
          echo "Attempt $i: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Canary healthy"
            exit 0
          fi
          sleep 10
        done
        echo "❌ Canary health check failed after 5 attempts — aborting traffic migration"
        exit 1

  # Step 5: Migrate 100% of traffic to the new revision
  # FIX-40: Only runs if health check passed. Old revision stays alive for instant rollback.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'proposal-engine'
      - '--region'
      - '${_REGION}'
      - '--project'
      - '$PROJECT_ID'
      - '--to-latest'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/proposal-engine/app:${_COMMIT_SHA}'

