name: Test Suite

on:
  push:
    branches: [main, 'remediation/**', 'execution/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce dependency advisory policy
        run: npm run security:audit:prod

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (0 errors required)
        run: npm run lint -- --max-warnings=99999

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: npx prisma validate

      - name: Start canonical local Postgres and PgBouncer stack
        run: docker compose -f docker-compose.yml up -d --wait postgres && docker compose -f docker-compose.pgbouncer.yml up -d --wait pgbouncer

      - name: Empty-database migration replay (drift gate)
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5435/proposal_engine_empty_replay
        run: |
          docker exec proposal_engine_db psql -U postgres -d postgres -c 'CREATE DATABASE proposal_engine_empty_replay'
          npx prisma migrate deploy
          npx prisma migrate status
          # Fail if schema.prisma drifts from the committed migration chain
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Run migrations and deterministic tests
        env:
          PROPOSALOS_TEST_DB_ADMIN_USER: postgres
          PROPOSALOS_TEST_DB_ADMIN_PASSWORD: password
          PROPOSALOS_TEST_DB_APP_PASSWORD: password
          PROPOSALOS_PGBOUNCER_CONTAINER: proposalos-pgbouncer
          PROPOSALOS_POSTGRES_CONTAINER: proposal_engine_db
          PROPOSALOS_RLS_SET_ROLE_PASSWORD: '0'
          PROPOSALOS_PGBOUNCER_HOST: localhost
          PROPOSALOS_PGBOUNCER_PORT: '6432'
          PROPOSALOS_TEST_DB_PORT: '5435'
          NODE_ENV: test
        run: bash scripts/bootstrap-test-databases.sh -- npm test -- --reporter=dot

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-artifacts
          path: docs/audits/2026-09-18-proposal-os-ground-up-ga-audit/artifacts/
          if-no-files-found: ignore
