name: Test Suite

on:
  workflow_call:
  push:
    branches: [main, 'remediation/**', 'execution/**']
  pull_request:

jobs:
  dependency-policy:
    name: Dependency advisory policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce dependency advisory policy
        run: npm run security:audit:prod

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (0 errors required)
        run: npm run lint -- --max-warnings=99999

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: npx prisma validate

      - name: Start canonical local Postgres and PgBouncer stack
        run: docker compose -f docker-compose.yml up -d --wait postgres && docker compose -f docker-compose.pgbouncer.yml up -d --wait pgbouncer

      - name: Empty-database migration replay (drift gate)
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5435/proposal_engine_empty_replay
        run: |
          docker exec proposal_engine_db psql -U postgres -d postgres -c 'CREATE DATABASE proposal_engine_empty_replay'
          npx prisma migrate deploy
          npx prisma migrate status
          # Fail if schema.prisma drifts from the committed migration chain
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Run migrations and deterministic tests
        env:
          PROPOSALOS_TEST_DB_ADMIN_USER: postgres
          PROPOSALOS_TEST_DB_ADMIN_PASSWORD: password
          PROPOSALOS_TEST_DB_APP_PASSWORD: password
          PROPOSALOS_PGBOUNCER_CONTAINER: proposalos-pgbouncer
          PROPOSALOS_POSTGRES_CONTAINER: proposal_engine_db
          PROPOSALOS_RLS_SET_ROLE_PASSWORD: '0'
          PROPOSALOS_PGBOUNCER_HOST: 127.0.0.1
          PROPOSALOS_PGBOUNCER_PORT: '6432'
          PROPOSALOS_TEST_DB_PORT: '5435'
          NODE_ENV: test
        run: bash scripts/bootstrap-test-databases.sh -- npm test -- --reporter=dot

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qualification-artifacts
          path: docs/audits/2026-09-18-proposal-os-ground-up-ga-audit/artifacts/
          if-no-files-found: ignore

  controlled-fixture-journey:
    name: Controlled fixture journey (M1, no real inference)
    runs-on: ubuntu-latest
    # Bounded: the journey takes ~90s warm; generous ceiling for cold caches.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Start canonical local Postgres and PgBouncer stack
        run: docker compose -f docker-compose.yml up -d --wait postgres && docker compose -f docker-compose.pgbouncer.yml up -d --wait pgbouncer

      - name: Run the controlled joined fixture journey end-to-end
        # This job runs the REAL product (server, worker, collectors, graphs,
        # secure view, PDF) against a disposable database and local fixtures.
        # The LLM boundary is the deterministic fixture provider and external
        # providers are local fixture servers — this is fixture execution,
        # explicitly NOT real inference, and uses no credentials.
        env:
          JOURNEY_DB_ADMIN_URL: postgresql://postgres:password@127.0.0.1:5435/postgres
          JOURNEY_NEXT_PORT: '3117'
        run: node tests/journey/run-journey.mjs

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: controlled-journey-evidence-${{ github.run_id }}
          path: tests/journey/evidence/
          if-no-files-found: warn

  claraud-web:
    name: Build Claraud web application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: claraud-web/package-lock.json

      - name: Install Claraud web dependencies
        run: npm ci --legacy-peer-deps
        working-directory: claraud-web

      - name: Enforce production dependency advisory policy
        run: npm audit --omit=dev --audit-level=high
        working-directory: claraud-web

      - name: Point shared Prisma output at Claraud dependencies
        run: ln -s ./claraud-web/node_modules ./node_modules

      - name: Generate Prisma Client
        run: npx prisma generate --schema=../prisma/schema.prisma
        working-directory: claraud-web

      - name: Remove temporary Prisma output link
        run: rm ../node_modules
        working-directory: claraud-web

      - name: Build Claraud web
        run: npm run build
        working-directory: claraud-web
        env:
          NEXT_PUBLIC_APP_URL: https://claraud.com
          NEXT_PUBLIC_BASE_URL: https://claraud.com
          NEXT_PUBLIC_APP_VERSION: ci
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_public
